<!DOCTYPE html>
<html>
    <head>
        <style>
            .container {
                position: relative; /* Σημείο αναφοράς για τα απόλυτα τοποθετημένα παιδιά */
                height: 200px;
                background-color: #f4f4f4;
                overflow: hidden; /* Κρύβει οτιδήποτε βγει έξω από το κουτί */
            }
            
            .floating-badge {
                display: block; /* Συμπεριφορά μπλοκ */
                position: absolute; /* Ελεύθερη τοποθέτηση μέσα στον .container */
                top: 10px;
                right: 20px;
                bottom: auto;
                left: auto;
                z-index: 100; /* Εμφανίζεται πάνω από άλλα στοιχεία */
                background: red;
                color: white;
                padding: 5px 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <p>Κύριο περιεχόμενο...</p>
            <div class="floating-badge">ΝΕΟ!</div>
        </div>
    </body>
</html>
