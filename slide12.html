<!DOCTYPE html>
<html>
    <head>
        <style>
            .hero-section {
                color: #ffffff; /* Χρώμα κειμένου */
                background-color: #333333; /* Εναλλακτικό χρώμα φόντου */
                background-image: url('https://via.placeholder.com/800x400');
                background-size: cover; /* Καλύπτει όλο το στοιχείο */
                background-position: center; /* Κεντράρει την εικόνα */
                opacity: 0.9; /* Ελαφριά διαφάνεια */
                padding: 50px;
            }
        </style>
    </head>
    <body>
        <div class="hero-section">
            <h2>Καλώς ήρθατε</h2>
            <p>Αυτή η ενότητα έχει εικόνα φόντου και λευκό κείμενο.</p>
        </div>
    </body>
</html>
