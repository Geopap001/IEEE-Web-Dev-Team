<!DOCTYPE html>
<html>
    <head>
        <style>
            .typography-example {
                font-family: 'Arial', sans-serif; /* Γραμματοσειρά */
                font-size: 18px; /* Μέγεθος */
                font-weight: bold; /* Πάχος */
                text-align: center; /* Οριζόντια στοίχιση */
                text-decoration: underline; /* Υπογράμμιση */
                text-transform: uppercase; /* Όλα κεφαλαία */
                line-height: 1.6; /* Απόσταση γραμμών */
                letter-spacing: 2px; /* Κενό μεταξύ γραμμάτων */
            }
        </style>
    </head>
    <body>
        <p class="typography-example">
            Αυτό το κείμενο έχει υποστεί<br>πλήρη τυπογραφική μορφοποίηση.
        </p>
    </body>
</html>
