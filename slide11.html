<!DOCTYPE html>
<html>
    <head>
        <style>
            /* Εφαρμόζεται σε όλα τα στοιχεία μηδενίζοντας τα περιθώρια */
            * { margin: 0; }
            
            /* Επιλέγει όλες τις παραγράφους */
            p { font-size: 14px; }
            
            /* Επιλέγει στοιχεία με τη συγκεκριμένη κλάση */
            .highlight { background-color: yellow; }
            
            /* Επιλέγει το μοναδικό στοιχείο με αυτό το ID */
            #main-title { color: blue; }
            
            /* Ενεργοποιείται όταν το ποντίκι είναι πάνω από τον σύνδεσμο */
            a:hover { color: red; }
            
            /* Επιλέγει το δεύτερο στοιχείο λίστας */
            li:nth-child(2) { font-weight: bold; }
            
            /* Προσθέτει περιεχόμενο πριν και μετά τον τίτλο */
            h2::before { content: ">> "; }
            h2::after { content: " <<"; }
        </style>
    </head>
    <body>
        <h1 id="main-title">Τίτλος Σελίδας</h1>
        <h2>Υπότιτλος</h2>
        <p class="highlight">Αυτή είναι μια επισημασμένη παράγραφος.</p>
        <p>Πατήστε <a href="#">εδώ</a> για περισσότερα.</p>
        <ul>
            <li>Πρώτο στοιχείο</li>
            <li>Δεύτερο στοιχείο (Έντονο)</li>
            <li>Τρίτο στοιχείο</li>
        </ul>
    </body>
</html>
