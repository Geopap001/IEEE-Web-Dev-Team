<!DOCTYPE html>
<html>
    <head>
        <style>
            .card {
                padding: 20px;
                background-color: white;
                border: 2px solid #3498db; /* Πάχος, στυλ, χρώμα περιγράμματος */
                border-radius: 10px; /* Στρογγυλεμένες γωνίες */
                box-shadow: 5px 5px 15px rgba(0,0,0,0.3); /* Σκιά στο κουτί */
                text-shadow: 1px 1px 2px gray; /* Σκιά στο κείμενο */
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h3>Κάρτα Πληροφοριών</h3>
            <p>Μια όμορφη κάρτα με περίγραμμα και σκιές.</p>
        </div>
    </body>
</html>
