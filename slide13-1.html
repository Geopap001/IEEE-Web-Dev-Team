<!DOCTYPE html>
<html>
    <head>
        <style>
            .box {
                box-sizing: border-box; /* Το padding/border δεν αυξάνουν το συνολικό μέγεθος */
                width: 300px; /* Πλάτος */
                height: 150px; /* Ύψος */
                padding: 20px; /* Εσωτερικό κενό (μεταξύ περιεχομένου και ορίου) */
                margin: 15px auto; /* Εξωτερικό κενό (πάνω-κάτω 15px, δεξιά-αριστερά στο κέντρο) */
                background-color: #e0e0e0;
            }
        </style>
    </head>
    <body>
        <div class="box">
            Αυτό το κουτί έχει σταθερές διαστάσεις 300x150, εσωτερικό περιθώριο 20px και είναι κεντραρισμένο.
        </div>
    </body>
</html>
