<!DOCTYPE html>
<html>
    <head>
        <style>
            .grid-container {
                display: grid; /* Ενεργοποίηση grid */
                grid-template-columns: 1fr 1fr 1fr; /* 3 ίσες στήλες */
                grid-template-rows: 100px 100px; /* 2 γραμμές των 100px */
                gap: 10px;
            }
            .grid-item {
                background-color: #2ecc71;
                padding: 10px;
            }
            .wide-item {
                grid-column: span 2; /* Αυτό το στοιχείο πιάνει 2 στήλες */
                background-color: #e74c3c;
            }
        </style>
    </head>
    <body>
        <div class="grid-container">
            <div class="grid-item">Κελί 1</div>
            <div class="grid-item wide-item">Κελί 2 (Πιάνει 2 στήλες)</div>
            <div class="grid-item">Κελί 3</div>
            <div class="grid-item">Κελί 4</div>
            <div class="grid-item">Κελί 5</div>
        </div>
    </body>
</html>
